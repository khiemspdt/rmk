[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.build]
description = "Build firmware for STM32G4"
command = "cargo"
args = ["build", "--release", "--target", "thumbv7em-none-eabi"]
dependencies = ["flip-link"]

[tasks.flash]
description = "Flash firmware to STM32G431CB using probe-rs"
command = "probe-rs"
args = ["download", "--chip", "stm32g431cb", "target/thumbv7em-none-eabi/release/rmk-stm32g4"]
dependencies = ["flip-link"]

[tasks.hex]
description = "Build firmware and generate hex file for STM32G4"
command = "cargo"
args = ["objcopy", "--release", "--", "-O", "ihex", "rmk-stm32g4.hex"]
dependencies = ["build", "install-llvm-tools"]

[tasks.uf2]
description = "Build firmware and generate UF2 file for STM32G4"
command = "cargo"
args = [
    "hex-to-uf2",
    "--input-path",
    "rmk-stm32g4.hex",
    "--output-path",
    "rmk-stm32g4.uf2",
    "--family",
    "stm32g4",
]
dependencies = ["hex"]
